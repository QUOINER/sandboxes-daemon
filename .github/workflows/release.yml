name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and sign
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - name: Build release binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            os=${target%/*}
            arch=${target#*/}
            out="dist/sandboxesd-${os}-${arch}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags='-s -w' -o "$out" ./cmd/sandboxesd
            sha256sum "$out" > "$out.sha256"
          done
          cd dist && sha256sum * > SHA256SUMS
      - name: Install CycloneDX generator
        run: go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0
      - name: Generate SBOM
        run: cyclonedx-gomod mod -json -licenses -type library -output dist/sandboxesd.cdx.json .
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='${{ inputs.tag }}'
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --verify-tag --title "$tag" --generate-notes
          fi
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - uses: actions/attest@v4
        with:
          subject-path: dist/sandboxesd-*
          sbom-path: dist/sandboxesd.cdx.json
